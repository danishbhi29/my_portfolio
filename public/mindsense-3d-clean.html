<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindSense - 3D Multimodal Depression Screening Showcase</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Three.js & GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #e9ebe2;
      color: #212529;
      overflow: hidden;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    .mono { font-family: 'Fira Code', monospace; }

    .hero-card {
      background: rgba(235, 233, 226, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.98);
      transform: translateY(-1px);
    }

    .glass-btn.active {
      background: #ef4444;
      color: white;
      border-color: #dc2626;
    }

    .voice-bubble {
      position: absolute;
      transform: translate(-50%, -100%);
      background: #ffffff;
      border: 2px solid #ef4444;
      color: #1e293b;
      padding: 8px 14px;
      border-radius: 16px;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.25);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 30;
      white-space: nowrap;
    }

    .voice-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }

    .voice-bubble.visible {
      opacity: 1;
      transform: translate(-50%, -120%);
    }

    html, body { width: 100%; height: 100%; min-height: 0; margin: 0; overflow: hidden; background: #e9ebe2; }
    body { position: relative; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    #canvas-container canvas { display: block; width: 100%; height: 100%; }
    body > .absolute:not(#canvas-container), body > #speech-bubble, body > #monitor-canvas { display: none !important; }  </style>
</head>
<body class="w-screen h-screen overflow-hidden">

  <!-- 3D Canvas -->
  <div id="canvas-container" class="absolute inset-0 w-full h-full z-0 cursor-grab active:cursor-grabbing"></div>

  <!-- Character Voice Bubble -->
  <div id="speech-bubble" class="voice-bubble">
    <i class="fa-solid fa-microphone text-red-500 mr-1.5 animate-pulse"></i>
    <span id="speech-text">"I feel exhausted and hopeless every day..."</span>
  </div>

  <!-- TOP MINIMAL UI HEADER -->
  <div class="absolute top-3 left-3 right-3 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
    <div class="hero-card px-4 py-2 rounded-xl pointer-events-auto flex items-center gap-3">
      <span class="text-xs font-semibold tracking-wider text-gray-400 mono">06 / MULTIMODAL · DEEP LEARNING</span>
      <h1 class="text-sm font-bold text-gray-900 border-l border-gray-300 pl-3">MindSense</h1>
      <div class="hidden lg:flex items-center gap-1.5 mono text-[10px] border-l border-gray-300 pl-3">
        <span class="px-1.5 py-0.5 bg-white/90 border border-gray-300/80 rounded text-gray-700">PyTorch</span>
        <span class="px-1.5 py-0.5 bg-white/90 border border-gray-300/80 rounded text-gray-700">RoBERTa</span>
        <span class="px-1.5 py-0.5 bg-red-100 border border-red-300 rounded text-red-800 font-medium">OpenFace</span>
        <span class="px-1.5 py-0.5 bg-amber-100 border border-amber-300 rounded text-amber-800 font-medium">OpenSMILE</span>
        <span class="px-1.5 py-0.5 bg-gray-100 border border-gray-300 rounded text-gray-800 font-medium">FastAPI</span>
      </div>
    </div>

    <!-- Workflow Stages Navigation -->
    <div class="hero-card p-1.5 rounded-xl pointer-events-auto flex items-center gap-1 text-[11px] mono">
      <button onclick="goToStage(0)" id="step-btn-0" class="glass-btn px-2.5 py-1 rounded-lg flex items-center gap-1.5">
        <span class="w-3.5 h-3.5 rounded-full bg-red-500 text-white flex items-center justify-center text-[9px] font-bold">1</span>
        <span class="hidden sm:inline">PHQ-8 Text</span>
      </button>

      <button onclick="goToStage(1)" id="step-btn-1" class="glass-btn px-2.5 py-1 rounded-lg flex items-center gap-1.5">
        <span class="w-3.5 h-3.5 rounded-full bg-gray-300 text-gray-700 flex items-center justify-center text-[9px] font-bold">2</span>
        <span class="hidden sm:inline">Voice Audio</span>
      </button>

      <button onclick="goToStage(2)" id="step-btn-2" class="glass-btn px-2.5 py-1 rounded-lg flex items-center gap-1.5">
        <span class="w-3.5 h-3.5 rounded-full bg-gray-300 text-gray-700 flex items-center justify-center text-[9px] font-bold">3</span>
        <span class="hidden sm:inline">Facial Mesh</span>
      </button>

      <button onclick="goToStage(3)" id="step-btn-3" class="glass-btn px-2.5 py-1 rounded-lg flex items-center gap-1.5">
        <span class="w-3.5 h-3.5 rounded-full bg-gray-300 text-gray-700 flex items-center justify-center text-[9px] font-bold">4</span>
        <span class="hidden sm:inline">Result & PDF</span>
      </button>

      <button id="btn-replay" class="glass-btn px-2 py-1 rounded-lg text-gray-700 ml-1" title="Replay Sequence">
        <i class="fa-solid fa-rotate-right text-[10px]"></i>
      </button>
    </div>
  </div>

  <!-- BOTTOM CONTROL BAR -->
  <div class="absolute bottom-3 left-1/2 transform -translate-x-1/2 z-20 w-11/12 max-w-lg pointer-events-auto">
    <div class="hero-card px-4 py-2 rounded-full flex items-center justify-between shadow-md">
      <div class="flex items-center gap-2 overflow-hidden mr-2">
        <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping shrink-0"></span>
        <span id="status-text" class="text-[11px] font-medium mono text-gray-700 truncate">Stage 1: User answering PHQ-8 Questionnaire...</span>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btn-prev" class="w-7 h-7 rounded-full glass-btn flex items-center justify-center text-[10px] text-gray-700">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button id="btn-play-pause" class="px-2.5 py-1 rounded-full glass-btn text-[10px] font-semibold mono text-red-800 flex items-center gap-1">
          <i id="play-icon" class="fa-solid fa-pause"></i>
          <span id="play-text">Pause</span>
        </button>
        <button id="btn-next" class="w-7 h-7 rounded-full glass-btn flex items-center justify-center text-[10px] text-gray-700">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Offscreen Monitor Texture Canvas -->
  <canvas id="monitor-canvas" width="512" height="384" class="hidden"></canvas>

  <script>
    /* =========================================================================
     * THREE.JS & STATE SETUP
     * ========================================================================= */
    let scene, camera, renderer, controls;
    let computerGroup, monitorMesh, characterGroup, webcamLedMesh, chaiSteamParticles = [];
    let monitorCanvas, monitorCtx, monitorTexture;
    
    let currentStage = 0;
    let isPlaying = true;
    let stageTimeline = null;

    let phqQuestionIndex = 0;
    let selectedAnswers = [3, 2, 3, 3, 2];
    let cursorX = 250, cursorY = 250;
    let isDownloading = false;

    const PHQ_QUESTIONS = [
      "1. Little interest or pleasure in doing things?",
      "2. Feeling down, depressed, or hopeless?",
      "3. Trouble falling/staying asleep, or sleeping too much?",
      "4. Feeling tired or having little energy?",
      "5. Poor appetite or overeating?"
    ];

    const STAGE_DESCRIPTIONS = [
      "Stage 1/4: Text Assessment - Answering 5 PHQ-8 Depression Questions via mouse...",
      "Stage 2/4: Audio Analysis - OpenSMILE capturing vocal prosody & tone...",
      "Stage 3/4: Vision Scan - OpenFace webcam tracking 68 facial mesh landmarks...",
      "Stage 4/4: PyTorch Gated-Fusion Result: High Depression (18/24) | Report Ready!"
    ];

    const COLORS = {
      bg: 0xe9ebe2,
      grid: 0xc8c6be,
      woodDesk: 0xd6cbb0,
      deskLegs: 0x334155,
      chaiCup: 0xd97706,
      chaiTea: 0x92400e
    };

    window.addEventListener('DOMContentLoaded', () => {
      initScene();
      initMonitorCanvas();
      buildEnvironment();
      buildComputerDeskAndChai();
      buildSittingCharacter();
      setupLighting();
      setupEvents();

      startSequenceTimeline();
      animate();
    });

    function initScene() {
      const container = document.getElementById('canvas-container');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(COLORS.bg);
      scene.fog = new THREE.Fog(COLORS.bg, 25, 60);

      camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(0, 4.2, 9.8);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.02;
      controls.minDistance = 3;
      controls.maxDistance = 25;
      controls.target.set(0, 1.8, 0);
    }

    function setupLighting() {
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(8, 14, 8);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);

      const fillLight = new THREE.DirectionalLight(0xfca5a5, 0.4);
      fillLight.position.set(-8, 6, -6);
      scene.add(fillLight);
    }

    function buildEnvironment() {
      const gridHelper = new THREE.GridHelper(40, 40, COLORS.grid, COLORS.grid);
      gridHelper.position.y = 0;
      gridHelper.material.opacity = 0.7;
      gridHelper.material.transparent = true;
      scene.add(gridHelper);

      const planeGeo = new THREE.PlaneGeometry(80, 80);
      const planeMat = new THREE.ShadowMaterial({ opacity: 0.1 });
      const shadowPlane = new THREE.Mesh(planeGeo, planeMat);
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.y = -0.01;
      shadowPlane.receiveShadow = true;
      scene.add(shadowPlane);
    }

    /* =========================================================================
     * 2D MONITOR CANVAS RENDERER
     * ========================================================================= */
    function initMonitorCanvas() {
      monitorCanvas = document.getElementById('monitor-canvas');
      monitorCtx = monitorCanvas.getContext('2d');
      monitorTexture = new THREE.CanvasTexture(monitorCanvas);
      monitorTexture.encoding = THREE.sRGBEncoding;
      renderMonitorScreen();
    }

    function renderMonitorScreen() {
      const w = monitorCanvas.width;
      const h = monitorCanvas.height;

      // Dark UI background
      monitorCtx.fillStyle = '#0f172a';
      monitorCtx.fillRect(0, 0, w, h);

      // Top Window Titlebar
      monitorCtx.fillStyle = '#1e293b';
      monitorCtx.fillRect(0, 0, w, 40);

      monitorCtx.fillStyle = '#ef4444'; monitorCtx.beginPath(); monitorCtx.arc(18, 20, 5, 0, Math.PI * 2); monitorCtx.fill();
      monitorCtx.fillStyle = '#f59e0b'; monitorCtx.beginPath(); monitorCtx.arc(34, 20, 5, 0, Math.PI * 2); monitorCtx.fill();
      monitorCtx.fillStyle = '#10b981'; monitorCtx.beginPath(); monitorCtx.arc(50, 20, 5, 0, Math.PI * 2); monitorCtx.fill();

      monitorCtx.fillStyle = '#e2e8f0';
      monitorCtx.font = '600 13px "Fira Code", monospace';
      monitorCtx.fillText("MindSense AI - Multimodal Screening", 70, 24);

      if (currentStage === 0) {
        // STAGE 1: QUESTIONNAIRE
        monitorCtx.fillStyle = '#10b981';
        monitorCtx.fillRect(w - 130, 10, 115, 20);
        monitorCtx.fillStyle = '#ffffff';
        monitorCtx.font = 'bold 10px "Fira Code", monospace';
        monitorCtx.fillText("MODEL: RoBERTa", w - 122, 24);

        monitorCtx.fillStyle = '#38bdf8';
        monitorCtx.font = 'bold 13px "Inter", sans-serif';
        monitorCtx.fillText(`PHQ-8 Assessment (${phqQuestionIndex + 1}/5)`, 25, 75);

        monitorCtx.fillStyle = '#ffffff';
        monitorCtx.font = '500 13px "Inter", sans-serif';
        monitorCtx.fillText(PHQ_QUESTIONS[phqQuestionIndex], 25, 105);

        const options = ["0 - Not at all", "1 - Several days", "2 - More than half the days", "3 - Nearly every day"];
        const selectedOpt = selectedAnswers[phqQuestionIndex];

        options.forEach((opt, idx) => {
          const btnY = 135 + idx * 45;
          const isSel = idx === selectedOpt;
          
          monitorCtx.fillStyle = isSel ? '#ef4444' : '#334155';
          monitorCtx.fillRect(25, btnY, w - 50, 36);

          monitorCtx.fillStyle = '#ffffff';
          monitorCtx.font = '500 12px "Inter", sans-serif';
          monitorCtx.fillText(opt, 45, btnY + 22);

          if (isSel) {
            monitorCtx.fillStyle = '#ffffff';
            monitorCtx.beginPath();
            monitorCtx.arc(w - 45, btnY + 18, 6, 0, Math.PI * 2);
            monitorCtx.fill();
          }
        });

      } else if (currentStage === 1) {
        // STAGE 2: AUDIO OpenSMILE WAVEFORM
        monitorCtx.fillStyle = '#f59e0b';
        monitorCtx.fillRect(w - 140, 10, 125, 20);
        monitorCtx.fillStyle = '#ffffff';
        monitorCtx.font = 'bold 10px "Fira Code", monospace';
        monitorCtx.fillText("MODEL: OpenSMILE", w - 132, 24);

        monitorCtx.fillStyle = '#38bdf8';
        monitorCtx.font = 'bold 13px "Inter", sans-serif';
        monitorCtx.fillText("Vocal Acoustic & Pitch Spectrum Analysis", 25, 75);

        // Audio Waveform
        monitorCtx.strokeStyle = '#ef4444';
        monitorCtx.lineWidth = 3;
        monitorCtx.beginPath();
        const time = Date.now() * 0.008;
        for (let x = 25; x < w - 25; x += 5) {
          const y = 180 + Math.sin(x * 0.05 + time) * 35 * Math.sin(x * 0.01);
          if (x === 25) monitorCtx.moveTo(x, y);
          else monitorCtx.lineTo(x, y);
        }
        monitorCtx.stroke();

        monitorCtx.fillStyle = '#94a3b8';
        monitorCtx.font = '11px "Fira Code", monospace';
        monitorCtx.fillText("Audio Features: Pitch Jitter, Formant F1-F3, Energy Slope", 25, 270);
        monitorCtx.fillText("Status: Recording Speech Sample... [4.2s]", 25, 300);

      } else if (currentStage === 2) {
        // STAGE 3: FACIAL MESH OpenFace
        monitorCtx.fillStyle = '#3b82f6';
        monitorCtx.fillRect(w - 130, 10, 115, 20);
        monitorCtx.fillStyle = '#ffffff';
        monitorCtx.font = 'bold 10px "Fira Code", monospace';
        monitorCtx.fillText("MODEL: OpenFace", w - 122, 24);

        monitorCtx.fillStyle = '#38bdf8';
        monitorCtx.font = 'bold 13px "Inter", sans-serif';
        monitorCtx.fillText("Facial Landmark Tracking & Action Units (AU)", 25, 70);

        // Camera Feed Outer Frame Box
        const camX = 160, camY = 85, camW = 192, camH = 185;
        monitorCtx.fillStyle = '#020617';
        monitorCtx.fillRect(camX, camY, camW, camH);

        const centerX = camX + camW / 2;
        const centerY = camY + camH / 2 + 10;
        const time = Date.now() * 0.003;
        const pulse = Math.sin(time) * 2;

        // --- DRAW CHARACTER FACE INSIDE WEBCAM STREAM ---
        // Hair (Back)
        monitorCtx.fillStyle = '#1e293b';
        monitorCtx.beginPath();
        monitorCtx.arc(centerX, centerY - 15, 52, Math.PI, 0);
        monitorCtx.fill();

        // Head / Skin
        monitorCtx.fillStyle = '#fde047';
        monitorCtx.beginPath();
        monitorCtx.ellipse(centerX, centerY, 42, 48, 0, 0, Math.PI * 2);
        monitorCtx.fill();

        // Hair (Front / Bangs)
        monitorCtx.fillStyle = '#1e293b';
        monitorCtx.beginPath();
        monitorCtx.ellipse(centerX, centerY - 38, 44, 20, 0, 0, Math.PI);
        monitorCtx.fill();

        // Sad Eyebrows (Lowered Brow - AU04)
        monitorCtx.strokeStyle = '#334155';
        monitorCtx.lineWidth = 3.5;
        monitorCtx.beginPath();
        monitorCtx.moveTo(centerX - 28, centerY - 15);
        monitorCtx.lineTo(centerX - 8, centerY - 10);
        monitorCtx.moveTo(centerX + 8, centerY - 10);
        monitorCtx.lineTo(centerX + 28, centerY - 15);
        monitorCtx.stroke();

        // Eyes
        monitorCtx.fillStyle = '#0f172a';
        monitorCtx.beginPath();
        monitorCtx.arc(centerX - 18, centerY - 4, 5, 0, Math.PI * 2);
        monitorCtx.arc(centerX + 18, centerY - 4, 5, 0, Math.PI * 2);
        monitorCtx.fill();

        // Nose
        monitorCtx.strokeStyle = '#ca8a04';
        monitorCtx.lineWidth = 2;
        monitorCtx.beginPath();
        monitorCtx.moveTo(centerX, centerY - 2);
        monitorCtx.lineTo(centerX - 3, centerY + 12);
        monitorCtx.lineTo(centerX + 3, centerY + 12);
        monitorCtx.stroke();

        // Sad Mouth (Lip Corner Depressor - AU12)
        monitorCtx.strokeStyle = '#b45309';
        monitorCtx.lineWidth = 3;
        monitorCtx.beginPath();
        monitorCtx.arc(centerX, centerY + 32, 14, Math.PI + 0.4, -0.4, true);
        monitorCtx.stroke();

        // --- OPENFACE GREEN BOUNDING BOX & MESH OVERLAY ---
        monitorCtx.strokeStyle = '#10b981';
        monitorCtx.lineWidth = 2;
        monitorCtx.strokeRect(camX + 30 + pulse / 2, camY + 15 - pulse / 2, camW - 60 - pulse, camH - 30 + pulse);

        // OpenFace Mesh Points (68 Landmarks outline)
        const landmarks = [
          // Eyebrows
          [centerX - 28, centerY - 15], [centerX - 18, centerY - 13], [centerX - 8, centerY - 10],
          [centerX + 8, centerY - 10], [centerX + 18, centerY - 13], [centerX + 28, centerY - 15],
          // Eyes
          [centerX - 23, centerY - 4], [centerX - 13, centerY - 4],
          [centerX + 13, centerY - 4], [centerX + 23, centerY - 4],
          // Nose
          [centerX, centerY - 2], [centerX, centerY + 5], [centerX - 4, centerY + 12], [centerX + 4, centerY + 12],
          // Mouth
          [centerX - 14, centerY + 26], [centerX, centerY + 22], [centerX + 14, centerY + 26],
          [centerX - 10, centerY + 30], [centerX, centerY + 31], [centerX + 10, centerY + 30],
          // Chin / Jawline contour
          [centerX - 36, centerY + 10], [centerX - 24, centerY + 36], [centerX, centerY + 46], [centerX + 24, centerY + 36], [centerX + 36, centerY + 10]
        ];

        // Draw Mesh Connecting Lines
        monitorCtx.strokeStyle = 'rgba(110, 231, 183, 0.45)';
        monitorCtx.lineWidth = 1;
        monitorCtx.beginPath();
        landmarks.forEach((pt, idx) => {
          if (idx > 0 && idx % 3 !== 0) {
            monitorCtx.lineTo(pt[0], pt[1]);
          } else {
            monitorCtx.moveTo(pt[0], pt[1]);
          }
        });
        monitorCtx.stroke();

        // Draw Mesh Landmark Points
        monitorCtx.fillStyle = '#6EE7B7';
        landmarks.forEach(pt => {
          monitorCtx.beginPath();
          monitorCtx.arc(pt[0], pt[1], 2.5, 0, Math.PI * 2);
          monitorCtx.fill();
        });

        // Action Units Status Labels
        monitorCtx.fillStyle = '#10b981';
        monitorCtx.font = '10px "Fira Code", monospace';
        monitorCtx.fillText("AU12 (Lip Depressor): 88%", 25, 298);
        monitorCtx.fillText("AU04 (Brow Lowerer): HIGH", 280, 298);
        monitorCtx.fillText("Face Tracking Confidence: 99.4%", 25, 316);

      } else if (currentStage === 3) {
        // STAGE 4: RESULT & DOWNLOAD REPORT
        monitorCtx.fillStyle = '#dc2626';
        monitorCtx.fillRect(w - 145, 10, 130, 20);
        monitorCtx.fillStyle = '#ffffff';
        monitorCtx.font = 'bold 10px "Fira Code", monospace';
        monitorCtx.fillText("PyTorch Gated-Fusion", w - 140, 24);

        monitorCtx.fillStyle = '#f87171';
        monitorCtx.font = 'bold 15px "Inter", sans-serif';
        monitorCtx.fillText("MULTIMODAL ASSESSMENT RESULT", 25, 75);

        // Result Card Box
        monitorCtx.fillStyle = '#1e293b';
        monitorCtx.fillRect(25, 95, w - 50, 150);
        monitorCtx.strokeStyle = '#ef4444';
        monitorCtx.lineWidth = 2;
        monitorCtx.strokeRect(25, 95, w - 50, 150);

        monitorCtx.fillStyle = '#ffffff';
        monitorCtx.font = 'bold 18px "Inter", sans-serif';
        monitorCtx.fillText("Your Depression Level is HIGH", 45, 135);

        monitorCtx.fillStyle = '#fca5a5';
        monitorCtx.font = '600 13px "Fira Code", monospace';
        monitorCtx.fillText("PHQ-8 Score: 18 / 24  (Severe Risk)", 45, 165);

        monitorCtx.fillStyle = '#cbd5e1';
        monitorCtx.font = '11px "Inter", sans-serif';
        monitorCtx.fillText("Signals: Text (RoBERTa 85%), Voice (0.82), Face (AU 0.91)", 45, 195);

        // Download Report Button
        const btnColor = isDownloading ? '#10b981' : '#ef4444';
        monitorCtx.fillStyle = btnColor;
        monitorCtx.fillRect(45, 270, w - 90, 48);

        monitorCtx.fillStyle = '#ffffff';
        monitorCtx.font = 'bold 14px "Inter", sans-serif';
        monitorCtx.textAlign = 'center';
        monitorCtx.fillText(isDownloading ? "✓ Downloading Report PDF..." : "[ Click Here to Download Complete Report ]", w / 2, 300);
        monitorCtx.textAlign = 'left';
      }

      // Render Mouse Cursor on Screen in Stage 1 & 4
      if (currentStage === 0 || currentStage === 3) {
        monitorCtx.fillStyle = '#ffffff';
        monitorCtx.strokeStyle = '#000000';
        monitorCtx.lineWidth = 1;
        monitorCtx.beginPath();
        monitorCtx.moveTo(cursorX, cursorY);
        monitorCtx.lineTo(cursorX + 12, cursorY + 12);
        monitorCtx.lineTo(cursorX + 4, cursorY + 14);
        monitorCtx.closePath();
        monitorCtx.fill();
        monitorCtx.stroke();
      }

      if (monitorTexture) monitorTexture.needsUpdate = true;
    }

    /* =========================================================================
     * 3D MODELS SETUP
     * ========================================================================= */
    function buildComputerDeskAndChai() {
      computerGroup = new THREE.Group();

      // Desk
      const deskMat = new THREE.MeshStandardMaterial({ color: COLORS.woodDesk, roughness: 0.4 });
      const deskTop = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.15, 2.4), deskMat);
      deskTop.position.set(0, 1.4, 0);
      deskTop.castShadow = true;
      computerGroup.add(deskTop);

      const legMat = new THREE.MeshStandardMaterial({ color: COLORS.deskLegs, roughness: 0.5 });
      [[-2.0, 0.7, -1.0], [2.0, 0.7, -1.0], [-2.0, 0.7, 1.0], [2.0, 0.7, 1.0]].forEach(pos => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.4, 0.12), legMat);
        leg.position.set(...pos);
        computerGroup.add(leg);
      });

      // Monitor
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 });
      
      const frame = new THREE.Mesh(new THREE.BoxGeometry(2.7, 1.85, 0.12), darkMat);
      frame.position.set(0, 2.5, -0.4);
      computerGroup.add(frame);

      const stem = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.5, 0.1), darkMat);
      stem.position.set(0, 1.7, -0.4);
      computerGroup.add(stem);

      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 0.08, 16), darkMat);
      base.position.set(0, 1.48, -0.4);
      computerGroup.add(base);

      // Web Camera mounted on top of monitor
      const camHousingMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2 });
      const webcam = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.12), camHousingMat);
      webcam.position.set(0, 3.48, -0.4);
      computerGroup.add(webcam);

      // Web Camera LED Indicator (Green when active)
      const ledMat = new THREE.MeshBasicMaterial({ color: 0x334155 });
      webcamLedMesh = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), ledMat);
      webcamLedMesh.position.set(0.1, 3.48, -0.33);
      computerGroup.add(webcamLedMesh);

      // Screen Face
      const screenMat = new THREE.MeshBasicMaterial({ map: monitorTexture });
      monitorMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.55, 1.7), screenMat);
      monitorMesh.position.set(0, 2.5, -0.33);
      computerGroup.add(monitorMesh);

      // Keyboard & Mouse
      const kb = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.04, 0.45), darkMat);
      kb.position.set(-0.2, 1.49, 0.3);
      computerGroup.add(kb);

      const mouse = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.04, 0.22), darkMat);
      mouse.position.set(0.7, 1.49, 0.3);
      computerGroup.add(mouse);

      // Steaming Hot Chai Mug
      const mugMat = new THREE.MeshStandardMaterial({ color: COLORS.chaiCup, roughness: 0.3 });
      const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.24, 16), mugMat);
      mug.position.set(-1.2, 1.59, 0.3);
      computerGroup.add(mug);

      for (let i = 0; i < 4; i++) {
        const pMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 });
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), pMat);
        p.position.set(-1.2 + (Math.random() - 0.5) * 0.06, 1.75 + i * 0.08, 0.3 + (Math.random() - 0.5) * 0.06);
        computerGroup.add(p);
        chaiSteamParticles.push(p);
      }

      // Office Chair
      const chairMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 });
      const seat = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.12, 1.1), chairMat);
      seat.position.set(0, 0.9, 1.3);
      computerGroup.add(seat);

      const back = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 0.12), chairMat);
      back.position.set(0, 1.45, 1.8);
      computerGroup.add(back);

      scene.add(computerGroup);
    }

    function buildSittingCharacter() {
      characterGroup = new THREE.Group();

      const skinMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.4 });
      const shirtMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.5 });
      const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6 });

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.32, 0.85, 16), shirtMat);
      torso.position.set(0, 1.35, 1.3);
      characterGroup.add(torso);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 20), skinMat);
      head.position.set(0, 1.95, 1.3);
      characterGroup.add(head);

      const armL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.5, 0.12), shirtMat);
      armL.position.set(-0.36, 1.3, 0.9);
      armL.rotation.x = -Math.PI / 4;
      const armR = armL.clone();
      armR.position.x = 0.36;
      characterGroup.add(armL);
      characterGroup.add(armR);

      scene.add(characterGroup);
    }

    /* =========================================================================
     * 4. WORKFLOW TIMELINE LOGIC
     * ========================================================================= */
    function showVoiceBubble(text) {
      const bubble = document.getElementById('speech-bubble');
      document.getElementById('speech-text').innerText = `"${text}"`;
      
      const headPos = new THREE.Vector3(0, 2.2, 1.3);
      headPos.project(camera);

      const x = (headPos.x * .5 + .5) * window.innerWidth;
      const y = (-(headPos.y * .5) + .5) * window.innerHeight;

      bubble.style.left = `${x}px`;
      bubble.style.top = `${y - 15}px`;
      bubble.classList.add('visible');

      setTimeout(() => {
        bubble.classList.remove('visible');
      }, 3000);
    }

    function startSequenceTimeline() {
      if (stageTimeline) stageTimeline.kill();

      stageTimeline = gsap.timeline({
        onComplete: () => {
          if (isPlaying) {
            setTimeout(() => { goToStage(0); }, 4500);
          }
        }
      });

      // --- STAGE 1: TEXT ASSESSMENT (Clicking 5 PHQ-8 Questions) ---
      stageTimeline.call(() => {
        updateStageUI(0);
        webcamLedMesh.material.color.setHex(0x334155);
      });

      for (let q = 0; q < 5; q++) {
        stageTimeline
          .to({}, { duration: 0.6 })
          .call(() => {
            phqQuestionIndex = q;
            // Animate Mouse Cursor to Option
            const targetY = 135 + selectedAnswers[q] * 45 + 18;
            gsap.to(window, {
              duration: 0.4,
              onUpdate: () => {
                cursorX = 250;
                cursorY = targetY;
                renderMonitorScreen();
              }
            });
          })
          .to({}, { duration: 0.4 });
      }

      // --- STAGE 2: VOICE AUDIO RECORDING ---
      stageTimeline.to({}, { duration: 1.0 })
      .call(() => {
        updateStageUI(1);
        showVoiceBubble("I feel exhausted, sad, and hopeless every day...");
        renderMonitorScreen();
      });

      // --- STAGE 3: FACIAL MESH OPENFACE SCAN ---
      stageTimeline.to({}, { duration: 2.5 })
      .call(() => {
        updateStageUI(2);
        webcamLedMesh.material.color.setHex(0x22c55e); // Turn Webcam Green LED On
        renderMonitorScreen();
      });

      // --- STAGE 4: RESULT & REPORT DOWNLOAD CLICK ---
      stageTimeline.to({}, { duration: 2.8 })
      .call(() => {
        updateStageUI(3);
        webcamLedMesh.material.color.setHex(0x334155);
        isDownloading = false;

        // Animate Cursor to Download Button
        gsap.to(window, {
          duration: 0.6,
          onUpdate: () => {
            cursorX = 256;
            cursorY = 294;
            renderMonitorScreen();
          },
          onComplete: () => {
            isDownloading = true;
            renderMonitorScreen();
          }
        });
      });
    }

    function goToStage(stageIdx) {
      currentStage = stageIdx;
      updateStageUI(stageIdx);

      if (stageIdx === 0) {
        phqQuestionIndex = 0;
        webcamLedMesh.material.color.setHex(0x334155);
        startSequenceTimeline();
      } else if (stageIdx === 1) {
        webcamLedMesh.material.color.setHex(0x334155);
        showVoiceBubble("I feel exhausted, sad, and hopeless every day...");
        renderMonitorScreen();
      } else if (stageIdx === 2) {
        webcamLedMesh.material.color.setHex(0x22c55e);
        renderMonitorScreen();
      } else if (stageIdx === 3) {
        webcamLedMesh.material.color.setHex(0x334155);
        isDownloading = true;
        cursorX = 256; cursorY = 294;
        renderMonitorScreen();
      }
    }

    function updateStageUI(idx) {
      currentStage = idx;
      for (let i = 0; i < 4; i++) {
        const btn = document.getElementById(`step-btn-${i}`);
        if (btn) {
          if (i === idx) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      }
      document.getElementById('status-text').innerText = STAGE_DESCRIPTIONS[idx];
    }

    function setupEvents() {
      window.addEventListener('resize', onWindowResize);

      document.getElementById('btn-replay').addEventListener('click', () => { goToStage(0); });

      const playPauseBtn = document.getElementById('btn-play-pause');
      playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
          if (stageTimeline) stageTimeline.play();
          document.getElementById('play-icon').className = 'fa-solid fa-pause';
          document.getElementById('play-text').innerText = 'Pause';
        } else {
          if (stageTimeline) stageTimeline.pause();
          document.getElementById('play-icon').className = 'fa-solid fa-play';
          document.getElementById('play-text').innerText = 'Play';
        }
      });

      document.getElementById('btn-prev').addEventListener('click', () => {
        goToStage((currentStage - 1 + 4) % 4);
      });

      document.getElementById('btn-next').addEventListener('click', () => {
        goToStage((currentStage + 1) % 4);
      });
    }

    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = Date.now() * 0.0025;

      // Steaming Hot Chai particles animation
      chaiSteamParticles.forEach(p => {
        p.position.y += 0.0015;
        p.material.opacity -= 0.005;
        if (p.position.y > 2.05) {
          p.position.y = 1.75;
          p.material.opacity = 0.4;
        }
      });

      // Keep Canvas texture updated continuously for dynamic audio waveform, webcam facial mesh, & mouse cursor
      renderMonitorScreen();

      controls.update();
      renderer.render(scene, camera);
    }
  </script>
